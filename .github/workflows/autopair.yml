yaml
name: AutoPair
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node auto_pair_worker.js
      - run: |
          git config user.name "Bot"
          git config user.email "bot@local"
          git add data/paired-matches.json
          git commit -m "Update" || exit 0
          git push
