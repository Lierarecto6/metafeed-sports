<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#020617;color:#fff;font-family:sans-serif;padding:12px}
.top{background:#172554;padding:12px;border-radius:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
input,button{padding:7px 10px;border-radius:6px;border:0;font-weight:700;font-size:12px}
.b1{background:#059669;color:#fff}.b2{background:#2563eb;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.box{background:#0f172a;padding:12px;border-radius:10px;border:1px solid #1e293b}
.tm{color:#60a5fa;font-size:11px;font-weight:800;margin:8px 0 4px}
.c{background:#020617;border:1px solid #334155;padding:9px;border-radius:6px;margin-bottom:5px;display:flex;justify-content:space-between;font-size:12px}
.sel{border-color:#3b82f6;background:#1e3a8a}
</style></head><body>
<div class="top"><b>⚡ MetaFeed AI Auto-Pair</b><div><input type="date" id="dp" onchange="load()"> <button class="b1" onclick="auto()">🤖 Auto-Pair</button> <button class="b2" onclick="add()">+ Add</button> <b id="pt" style="color:#fcd34d">0 PTS</b></div></div>
<div class="grid"><div class="box"><b style="color:#60a5fa;font-size:12px">1. MASTER GAMES</b><div id="ml"></div></div><div class="box"><b style="color:#fb923c;font-size:12px">2. FEEDS TO PAIR</b><div id="fl"></div></div></div>
<script>
let pts=0,sel=null,M=[],F=[],dp=document.getElementById("dp");dp.value=new Date().toISOString().split("T");
function load(){const d=dp.value;M=[{id:1,t:"18:00",n:"⚽ Real Madrid vs Liverpool",ok:0},{id:2,t:"18:00",n:"⚽ Man Utd vs Arsenal",ok:0},{id:3,t:"20:30",n:"🏀 Lakers vs Warriors",ok:0},{id:4,t:"22:00",n:"🏀 Celtics vs Heat",ok:0}];F=[{id:1,t:"18:00",r:"R. Madrid - Liverpool",ok:0},{id:2,t:"18:00",r:"Man Utd v Arsenal",ok:0},{id:3,t:"20:30",r:"LA Lakers @ GSW",ok:0},{id:4,t:"22:00",r:"Boston vs Miami",ok:0}];draw();}
function auto(){F.forEach(f=>{if(!f.ok){let m=M.find(x=>x.t==f.t&&!x.ok);if(m){f.ok=m.ok=1;pts+=50;}}});draw();}
function pair(id){if(!sel)return alert("Pumili muna sa kaliwa!");F.find(x=>x.id==id).ok=M.find(x=>x.id==sel).ok=1;sel=null;pts+=100;draw();}
function add(){let n=prompt("Match name:"),t=prompt("Time (20:00):","20:00");if(n){M.push({id:Date.now(),t:t||"20:00",n,ok:0});draw();}}
function draw(){document.getElementById("pt").innerText=pts+" PTS";ml.innerHTML=fl.innerHTML="";[...new Set(M.map(x=>x.t))].sort().forEach(t=>{ml.innerHTML+=`<div class="tm">🕒 ${t}</div>`+M.filter(x=>x.t==t).map(m=>`<div onclick="sel=${m.id};draw()" class="c ${sel==m.id?'sel':''}"><span>${m.n}</span><b style="color:${m.ok?'#34d399':'#94a3b8'}">${m.ok?'✓ PAIRED':'Select'}</b></div>`).join("");});[...new Set(F.filter(x=>!x.ok).map(x=>x.t))].sort().forEach(t=>{fl.innerHTML+=`<div class="tm">🕒 ${t}</div>`+F.filter(x=>!x.ok&&x.t==t).map(f=>`<div onclick="pair(${f.id})" class="c"><span>${f.r}</span><b style="color:#34d399">Pair ➔</b></div>`).join("");});if(!fl.innerHTML)fl.innerHTML="<p style='color:#34d399;font-size:12px'>✅ All Paired!</p>";}
load();
</script></body></html>
